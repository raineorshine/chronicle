name: Release

# Builds Chronicle.app and publishes it as a downloadable GitHub Release.
#
# Trigger it by pushing a version tag:
#
#     git tag v1.2.0
#     git push origin v1.2.0
#
# or run it manually from the Actions tab (workflow_dispatch), passing the
# version to cut a release for.
#
# NOTE ON SIGNING: this repo has no Apple Developer identity in CI, so the app
# is ad-hoc signed and not notarized. It still runs, but Gatekeeper quarantines
# it on download. The release notes tell users how to clear the quarantine.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.2.0)'
        required: true

# Needed to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish Chronicle.app
    runs-on: macos-14

    env:
      # The tag on a tag push, or the manually-entered version on a dispatch.
      VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Chronicle app and chronicle-extract (Release)
        run: |
          for scheme in Chronicle chronicle-extract; do
            xcodebuild build \
              -project Chronicle.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -destination 'platform=macOS' \
              -derivedDataPath .build-xcode \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_ALLOWED=YES
          done

      - name: Ad-hoc sign with entitlements and hardened runtime
        run: |
          APP=.build-xcode/Build/Products/Release/Chronicle.app
          BIN=.build-xcode/Build/Products/Release/chronicle-extract
          test -d "$APP" || { echo "error: $APP not found" >&2; exit 1; }
          test -x "$BIN" || { echo "error: $BIN not found" >&2; exit 1; }

          codesign --force --deep --options runtime \
            --entitlements App/Chronicle.entitlements \
            --sign - "$APP"
          codesign --verify --strict "$APP"

          codesign --force --options runtime \
            --entitlements Extractor/Extractor.entitlements \
            --sign - "$BIN"
          codesign --verify --strict "$BIN"

      - name: Package app (zip + DMG) and CLI (tar.gz)
        run: |
          APP=.build-xcode/Build/Products/Release/Chronicle.app
          BIN=.build-xcode/Build/Products/Release/chronicle-extract
          ZIP="Chronicle-${VERSION}.zip"
          DMG="Chronicle-${VERSION}.dmg"
          CLI="chronicle-extract-${VERSION}.tar.gz"

          # ditto preserves the bundle's symlinks and metadata (plain `zip`
          # can corrupt .app packages).
          ditto -c -k --keepParent "$APP" "$ZIP"

          # A drag-to-Applications DMG for a friendlier install.
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Chronicle" \
            -srcfolder "$STAGING" -ov -format UDZO "$DMG"

          # The CLI is a bare Mach-O binary; tar preserves the exec bit.
          tar -czf "$CLI" -C "$(dirname "$BIN")" chronicle-extract

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Chronicle ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            Chronicle-${{ env.VERSION }}.zip
            Chronicle-${{ env.VERSION }}.dmg
            chronicle-extract-${{ env.VERSION }}.tar.gz
          body: |
            ## Chronicle ${{ env.VERSION }}

            A local calendar metrics dashboard for macOS (macOS 14+).

            ### Install the app

            1. Download **`Chronicle-${{ env.VERSION }}.dmg`** below.
            2. Open it and drag **Chronicle** into **Applications**.

            This build is ad-hoc signed and not notarized, so macOS will
            quarantine it on first launch. Clear the quarantine once:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Chronicle.app
            ```

            Then launch it from Spotlight or Launchpad. On first run, grant
            Calendar access when prompted.

            ### Install the daily extractor (optional)

            **`chronicle-extract-${{ env.VERSION }}.tar.gz`** is the CLI that
            rebuilds the metrics database on a schedule. The easiest way to set
            it up (binary + LaunchAgent) is still `scripts/install-agent.sh`
            from the repo. To use this prebuilt binary directly:

            ```bash
            tar -xzf chronicle-extract-${{ env.VERSION }}.tar.gz
            xattr -d com.apple.quarantine chronicle-extract
            ./chronicle-extract
            ```
